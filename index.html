<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitin Chandra — Thank you</title>
<meta name="description" content="Nitin Chandra — Brand & Content Strategist. Thank you for your likes and comments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:32px 22px;background:#07060b;color:#f3f1fa;font-family:'Space Grotesk',system-ui,sans-serif;text-align:center;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 30% 35%,rgba(255,46,136,.28),transparent 70%),radial-gradient(40% 35% at 70% 65%,rgba(0,224,255,.22),transparent 70%),radial-gradient(30% 30% at 55% 25%,rgba(200,255,0,.12),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-4%,3%,0) rotate(6deg)}}
main{max-width:880px}
.mark{font:800 18px/1 'Unbounded',sans-serif;letter-spacing:.02em;margin-bottom:38px}
.mark b{color:#ff2e88}
h1{font:800 clamp(34px,7.4vw,84px)/1.02 'Unbounded',sans-serif;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#ff2e88,#a855f7 45%,#00e0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin:26px auto 0;max-width:520px;font-size:clamp(16px,2.2vw,19px);line-height:1.6;color:#b9b4cc}
.heart{display:inline-block;margin-top:34px;width:46px;height:46px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
footer{margin-top:44px;font-size:14px;letter-spacing:.06em;color:#8f8aa6}
footer strong{color:#f3f1fa;font-weight:500}
@media (prefers-reduced-motion:reduce){body::before,.heart{animation:none}}
</style>
</head>
<body>
<main>
  <div class="mark">NC<b>.</b></div>
  <h1>Thank you for your <span>likes &amp; comments.</span></h1>
  <p class="sub">Your love means a lot. The site is getting a quick upgrade and will be back soon.</p>
  <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path fill="url(#g)" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
  <footer>Designed &amp; developed by <strong>Nitin Chandra</strong></footer>
</main>
</body>
</html>
